[project]
name = "personal-kb"
version = "1.5.0"
description = "Personal Knowledge MCP Server — structured retrieval, knowledge graph, and multi-granularity summaries"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "aiosqlite>=0.21",
    "sqlite-vec>=0.1.9",
    "httpx>=0.28",
    "packaging>=23",
    "anthropic>=0.40",
    "trafilatura>=2.0",
    "detect-secrets>=1.4",
    "scrubadub>=2.0",
    "pymupdf>=1.25",
    # The channel-agnostic engine. MUST be a real runtime dependency (not just
    # a dev-group dep) so `uvx`-from-git installs it — the server imports
    # kb_core directly. Resolved from the workspace via [tool.uv.sources] below.
    "kb-core==1.5.0",
    # The local kb-service daemon. A BASE dependency (not an extra) so the
    # plain `uvx --from git+...` install work users already run puts the
    # ``kb-service`` console script on PATH and local mode just works.
    # Workspace member at packages/kb-service (merged from the former
    # personal-kb-web-service repo).
    "personal-kb-web-service==1.5.0",
]

[project.scripts]
personal-kb = "personal_kb.__main__:main"
# NOTE: ``personal-kb-hook`` lives in its OWN standalone, zero-dependency
# package at ``packages/personal-kb-hook/`` so it can be ``uv tool install``ed
# without dragging in fastmcp/anthropic/pymupdf. Install command:
#   uv tool install --from \
#     "git+ssh://git@git-host.example.com/path/to/personal_kb#subdirectory=packages/personal-kb-hook" \
#     personal-kb-hook
# See ``packages/personal-kb-hook/pyproject.toml`` for the script entry.

[project.optional-dependencies]
aws = [
    "aws-sdk-bedrock-runtime>=0.3.0",
    # Control-char escaping fix upstreamed in smithy-lang/smithy-python#647
    # (merged 2026-03-13), released in smithy-json 0.2.2 (2026-04-07). The
    # >=0.2.2 floor guarantees the fix; no fork/git pin needed.
    "smithy-json>=0.2.2",
]
postgres = [
    "asyncpg>=0.29",
    "kb-core[postgres]==1.5.0",
    # Hosted Pis: the kb-service service-auth DB is Postgres too.
    "personal-kb-web-service[postgres]==1.5.0",
]
iam = [
    "boto3>=1.28",
]
safety = []  # backwards compat — deps moved to core in v0.60.0
# Back-compat alias: kb-service is a base dependency now, so ``[local]``
# installs nothing extra. Kept so existing ``personal-kb[local]`` specs resolve.
local = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4",
    "python-semantic-release>=10.5",
    "personal-kb[aws,postgres,iam]",
    # Workspace member — pulled in as an editable dev dep so the main repo's
    # tests can import ``personal_kb_hook`` (drift guard + cross-package
    # round-trip test). The standalone package itself has ZERO runtime deps.
    "personal-kb-hook",
    # Workspace member — kb-core is the channel-agnostic engine being
    # extracted out of personal_kb in waves. Wired in as a dev dep with all
    # optional extras so the main repo and its test suite can import it
    # once later waves move logic modules over. Today (wave 1) only ships
    # KbConfig + the import-purity guard.
    "kb-core[postgres,iam,aws,anthropic,ingest,safety]",
    "vulture>=2.15",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
personal-kb-hook = { workspace = true }
kb-core = { workspace = true }
personal-kb-web-service = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = ["eval: search quality evaluation tests"]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import ordering)
    "N",     # pep8-naming
    "D",     # pydocstyle (Google convention)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "D"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["detect_secrets", "detect_secrets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scrubadub", "scrubadub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["personal_kb.llm.bedrock", "kb_core.llm.bedrock"]
disallow_subclassing_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["aws_sdk_bedrock_runtime", "aws_sdk_bedrock_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_core", "smithy_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_http", "smithy_http.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_aws_core", "smithy_aws_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["personal_kb"]

[tool.coverage.report]
fail_under = 79.0

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
build_command = "uv lock && git add uv.lock && uv build"
allow_zero_version = true
major_on_zero = true
commit_message = "chore(release): v{version}"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.remote]
type = "github"
name = "github"
url = "ssh://git@github.com/jason-weddington/personal-kb-mcp.git"
ignore_token_for_push = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/personal_kb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
