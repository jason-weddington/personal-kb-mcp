[project]
name = "kb-core"
version = "1.8.0"
description = "Channel-agnostic graph-RAG engine: hybrid FTS+vector search, knowledge graph, agentic retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Jason Weddington" },
]
keywords = [
    "knowledge-base",
    "rag",
    "graph-rag",
    "hybrid-search",
    "vector-search",
    "sqlite",
    "knowledge-graph",
    "agentic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Nucleus runtime — the minimum needed to import kb_core and use the
# in-process SQLite backend with hybrid search. Anything provider-specific
# (anthropic, bedrock, postgres, ingest helpers) is gated behind an extra.
dependencies = [
    "aiosqlite>=0.21",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.0",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/jason-weddington/personal-kb-mcp"
Repository = "https://github.com/jason-weddington/personal-kb-mcp"
Issues = "https://github.com/jason-weddington/personal-kb-mcp/issues"

[project.optional-dependencies]
# Postgres backend
postgres = [
    "asyncpg>=0.29",
]
# RDS/Aurora IAM auth token signing
iam = [
    "boto3>=1.28",
]
# Bedrock provider for LLM calls.
# Control-char escaping fix upstreamed in smithy-lang/smithy-python#647
# (merged 2026-03-13), released in smithy-json 0.2.2 (2026-04-07). The
# >=0.2.2 floor guarantees the fix; no fork/git pin needed.
aws = [
    "aws-sdk-bedrock-runtime>=0.3.0",
    "smithy-json>=0.2.2",
]
# Anthropic provider for LLM calls
anthropic = [
    "anthropic>=0.40",
]
# File ingestion (HTML/PDF text extraction)
ingest = [
    "trafilatura>=2.0",
    "pymupdf>=1.25",
]
# Pre-store safety scrubbers
safety = [
    "detect-secrets>=1.4",
    "scrubadub>=2.0",
]
# Marker extra — Ollama is reached over httpx (already nucleus), so this
# carries no extra deps. Present so consumers can express intent in
# requirements files alongside the other providers.
ollama = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "S",
    "A",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "D"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Provider modules touch optional SDKs (anthropic / boto3 / bedrock /
# scrubadub / asyncpg) that ship without type stubs. Mirror the root
# pyproject's ``personal_kb.llm.bedrock`` overrides so the kb-core
# mypy run matches the main-package mypy run.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# sqlite-vec is a best-effort runtime import (search degrades to FTS-only
# without it) and ships no stubs, so whether mypy sees it depends on
# whether the extra happens to be installed in the checkout being checked.
# Without this override the gate passes locally and fails on a dispatch
# host — env-dependent red that has nothing to do with the change under test.
[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scrubadub", "scrubadub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aws_sdk_bedrock_runtime", "aws_sdk_bedrock_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_core", "smithy_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_http", "smithy_http.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smithy_aws_core", "smithy_aws_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["detect_secrets", "detect_secrets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kb_core.llm.bedrock"]
disallow_subclassing_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "postgres: integration tests requiring a real Postgres via KB_TEST_DATABASE_URL (skips when unset, unless KB_REQUIRE_POSTGRES_TESTS is truthy, in which case it fails)",
]

[tool.coverage.run]
source = ["kb_core"]
