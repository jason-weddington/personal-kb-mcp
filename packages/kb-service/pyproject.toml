[project]
name = "personal-kb-web-service"
version = "1.7.0"
description = "Hosted HTTP API wrapping the kb-core engine behind authentication."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21",
    "bcrypt>=4.0",
    "fastapi>=0.115",
    "fastmcp>=3.0,<4",
    "httpx>=0.28",
    "kb-core[postgres,ingest,anthropic,safety]==1.7.0",
    "mcp>=1.26,<2",
    "pydantic>=2.10",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "truststore>=0.10",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Hosted mode: the service-auth DB is Postgres (KB_SERVICE_DATABASE_URL).
# Local no-auth mode uses a SQLite service.db and does not need asyncpg.
postgres = ["asyncpg>=0.30"]

[project.scripts]
kb-service = "kb_service.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "pre-commit>=4",
    "python-semantic-release>=9",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "D"]
# Offline eval harnesses: scrappy by design (live service + /tmp inputs).
"evals/**" = ["S", "D", "E501", "E701", "E702", "E741", "SIM115"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
filterwarnings = [
    "error::DeprecationWarning",
    # Starlette's TestClient warns about httpx; cosmetic, not our code.
    # (StarletteDeprecationWarning isn't a DeprecationWarning subclass, so match
    # by message with no category filter.)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["kb_service"]
omit = [
    # Direct-DB bootstrap CLI (create-admin/make-admin); operational, not
    # hermetically unit-testable. Mirrors agent_gtd omitting its dispatch/mcp
    # modules from coverage.
    "src/kb_service/cli.py",
]

[tool.coverage.report]
precision = 1
fail_under = 96.1

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version}"
build_command = "uv lock && git add uv.lock && uv build"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_service"]

[tool.uv.sources]
kb-core = { workspace = true }
