# Every hook here CHECKS; none of them FIX. See kb-03099.
#
# A fixer hook mutates files and exits non-zero on the first commit attempt.
# Claude Code absorbs that (its commit-retry loop is the trigger), but the talos
# dispatch worker commits ONCE, so a fixer that rewrites the tree at commit time
# destroys a completed, gate-green unit of work and the run returns `failed`
# before pushing. Keep every hook check-only: this repo is dispatched to both
# harnesses, and packages/kb-service (the former personal-kb-web-service repo) lives here too.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # trailing-whitespace and end-of-file-fixer are deliberately ABSENT:
      # pre-commit-hooks ships no check-only variant, so the local
      # whitespace-check hook below replaces them.
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      # No --fix: ruff defaults to check-only.
      - id: ruff
      # --check makes ruff-format report instead of rewriting.
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: whitespace-check
        name: whitespace (check only, no fix)
        entry: scripts/check-whitespace.sh
        language: script
        types: [text]

      - id: conventional-commit
        name: Conventional Commit (main only)
        entry: "bash -c 'branch=$(git rev-parse --abbrev-ref HEAD); [ \"$branch\" != \"main\" ] && exit 0; head -1 \"$1\" | grep -qE \"^(feat|fix|chore|docs|refactor|test|ci|style|perf|build|revert)(\\(.+\\))?!?: .+\" || { echo \"Commit message on main must be a conventional commit\"; exit 1; }' --"
        language: system
        stages: [commit-msg]
        always_run: true

      - id: vulture
        name: vulture
        entry: uv run --frozen vulture
        language: system
        types: [python]
        args: [src/personal_kb/, vulture_allowlist.py, --min-confidence, '80']
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        args: [src/]
        pass_filenames: false

      # --- packages/kb-service (merged from personal-kb-web-service) ---
      - id: kb-service-mypy
        name: mypy (kb-service)
        entry: bash -c 'cd packages/kb-service && uv run --frozen --project ../.. mypy src/'
        language: system
        types: [python]
        files: '^packages/kb-service/'
        pass_filenames: false

      - id: github-release-only
        name: github receives release pushes only
        entry: scripts/guard_github_push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: kb-service-coverage
        name: coverage (kb-service)
        entry: bash -c 'log=$(mktemp); cd packages/kb-service && uv run --frozen --project ../.. pytest -q --cov --cov-report=term-missing > "$log" 2>&1; rc=$?; tail -6 "$log"; rm -f "$log"; exit $rc'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: kb-service-eslint
        name: eslint (kb-service frontend)
        entry: npm --prefix packages/kb-service/frontend run lint
        language: system
        pass_filenames: false
        files: '^packages/kb-service/frontend/.*\.(ts|tsx)$'

      - id: kb-service-tsc
        name: tsc (kb-service frontend)
        entry: bash -c "cd packages/kb-service/frontend && npx tsc -b --noEmit"
        language: system
        pass_filenames: false
        files: '^packages/kb-service/frontend/.*\.(ts|tsx)$'

      - id: kb-service-vitest
        name: vitest (kb-service frontend)
        entry: npm --prefix packages/kb-service/frontend run test
        language: system
        pass_filenames: false
        files: '^packages/kb-service/frontend/.*\.(ts|tsx)$'
        stages: [pre-push]

      - id: coverage
        name: coverage
        entry: uv run --frozen pytest -m "not eval" --cov --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
